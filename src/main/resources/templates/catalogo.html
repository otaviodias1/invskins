<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Skins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <h1 class="mb-4">Catálogo de Skins</h1>

    <!-- Formulário de Busca por Nome -->
    <form method="get" th:action="@{/skins}" class="mb-4 d-flex gap-2">
        <input type="text" name="nome" class="form-control" placeholder="Buscar por nome..." th:value="${termo}">
        <button class="btn btn-primary" type="submit">Buscar</button>
    </form>

    <!-- Grade de Cards de Skins -->
    <div class="row row-cols-1 row-cols-md-4 g-4" th:if="${skins != null and not #lists.isEmpty(skins)}">
        <div class="col" th:each="skin : ${skins}">
            <div class="card h-100">
                <img th:src="${skin.imagem}" class="card-img-top skin-img" alt="Imagem da skin">
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${skin.nome}">Nome da Skin</h6>
                    <span class="badge bg-secondary mb-2 align-self-start" th:text="${skin.raridade}">Raridade</span>
                    <p class="mb-3">R$ <span th:text="${skin.preco != null ? #numbers.formatDecimal(skin.preco, 1, 2) : '0,00'}">0,00</span></p>

                    <!-- Formulário de Adicionar ao Inventário (Se existirem inventários criados) -->
                    <form th:action="@{/inventarios/adicionar-item}" method="post" class="mt-auto" th:if="${inventarios != null and not #lists.isEmpty(inventarios)}">
                        <input type="hidden" name="skinExternalId" th:value="${skin.externalId}">

                        <div class="mb-2">
                            <label class="form-label small text-muted mb-1">Inventário:</label>
                            <select name="inventarioId" class="form-select form-select-sm" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option th:each="inv : ${inventarios}" th:value="${inv.id}" th:text="${inv.nome}"></option>
                            </select>
                        </div>

                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text">Qtd</span>
                            <input type="number" name="quantidade" class="form-control" value="1" min="1" required>
                        </div>

                        <button type="submit" class="btn btn-sm btn-outline-primary w-100">Adicionar</button>
                    </form>

                    <!-- Mensagem para criar inventário caso não exista nenhum -->
                    <div th:if="${inventarios == null or #lists.isEmpty(inventarios)}" class="mt-auto text-center">
                        <small class="text-muted">
                            <a href="/inventarios">Crie um inventário</a> para adicionar skins.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Caso nenhuma skin seja encontrada -->
    <p th:if="${skins == null or #lists.isEmpty(skins)}" class="text-muted mt-3">Nenhuma skin encontrada.</p>
</div>

</body>
</html>
