<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvSkins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Gerencie seu inventário de skins</h1>
        <p class="col-md-8 fs-4">Crie inventários, adicione skins do catálogo e acompanhe o valor total das suas coleções.</p>
        <a class="btn btn-primary btn-lg me-2" href="/inventarios">Ver inventários</a>
        <a class="btn btn-outline-primary btn-lg" href="/skins">Explorar catálogo</a>
    </div>

    <h2>Seus inventários</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${inventarios != null and not #lists.isEmpty(inventarios)}">
        <div class="col" th:each="inv : ${inventarios}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${inv.nome}">Nome</h5>
                    <p class="card-text text-muted" th:text="${inv.descricao}">Descrição</p>
                    <p class="text-muted small">
                        <span th:text="${inv.itens != null ? inv.itens.size() : 0}">0</span> itens ·
                        R$ <span th:text="${inv.valorTotal != null ? #numbers.formatDecimal(inv.valorTotal, 1, 2) : '0,00'}">0,00</span>
                    </p>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/inventarios/{id}(id=${inv.id})}">Ver detalhes</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${inventarios == null or #lists.isEmpty(inventarios)}" class="text-muted mt-3">
        Nenhum inventário criado ainda. <a href="/inventarios">Crie o primeiro</a>.
    </p>
</div>

</body>
</html>
