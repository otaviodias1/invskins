<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${inventario.nome}">Inventário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container"
     id="pagina"
     th:attr="data-inventario-id=${inventario.id}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 th:text="${inventario.nome}"></h1>
            <p class="text-muted" th:text="${inventario.descricao}"></p>
        </div>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalAdicionar">
            + Adicionar skin
        </button>
    </div>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <p class="fs-5">
        <strong>Valor total:</strong>
        R$
        <span th:text="${inventario.valorTotal != null ?
            #numbers.formatDecimal(inventario.valorTotal, 1, 2)
            : '0.00'}">
        </span>
    </p>

    <div class="row row-cols-1 row-cols-md-3 g-4">

        <div class="col"
             th:each="item : ${inventario.itens}"
             th:data-item-id="${item.id}">

            <div class="card h-100">

                <img th:if="${item.skin.imagem != null}"
                     th:src="${item.skin.imagem}"
                     class="card-img-top skin-img"
                     alt="Imagem da skin">

                <div class="card-body">

                    <h6 class="card-title"
                        th:text="${item.skin.nome}">
                    </h6>

                    <span class="badge bg-secondary mb-2"
                          th:text="${item.skin.raridade}">
                    </span>

                    <p class="mb-2">
                        R$
                        <span th:text="${item.skin.preco != null ?
                            #numbers.formatDecimal(item.skin.preco, 1, 2)
                            : '0.00'}">
                        </span>
                        cada
                    </p>

                    <div class="input-group input-group-sm mb-2 quantidade-group">

                        <button class="btn btn-outline-secondary btn-diminuir"
                                type="button">
                            -
                        </button>

                        <input type="number"
                               class="form-control text-center quantidade-input"
                               min="1"
                               th:value="${item.quantidade}"
                               readonly>

                        <button class="btn btn-outline-secondary btn-aumentar"
                                type="button">
                            +
                        </button>

                    </div>

                    <button class="btn btn-sm btn-outline-danger btn-remover-item">
                        Remover
                    </button>

                </div>
            </div>
        </div>

    </div>

    <p th:if="${inventario.itens == null or inventario.itens.isEmpty()}"
       class="text-muted">
        Nenhuma skin neste inventário ainda.
    </p>

</div>


<!-- Modal Adicionar skin -->

<div class="modal fade" id="modalAdicionar" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Adicionar skin ao inventário
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="text"
                       class="form-control mb-2"
                       id="buscaSkin"
                       placeholder="Buscar skin pelo nome...">

                <div id="resultadosBusca"
                     class="list-group"
                     style="max-height:220px; overflow-y:auto;">
                </div>

                <div id="skinSelecionada"
                     class="mt-3 d-none">

                    <p class="mb-1">
                        Selecionada:
                        <strong id="nomeSelecionada"></strong>
                    </p>

                    <label class="form-label">
                        Quantidade
                    </label>

                    <input type="number"
                           class="form-control"
                           id="quantidadeAdicionar"
                           value="1"
                           min="1">

                </div>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button"
                        class="btn btn-primary"
                        id="btnConfirmarAdicionar"
                        disabled
                        onclick="confirmarAdicionar()">
                    Adicionar
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Modal Confirmação de remoção -->

<div class="modal fade" id="modalRemover" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Confirmar remoção
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <p>
                    Remover
                    <strong id="nomeItemRemover"></strong>
                    deste inventário?
                </p>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button"
                        class="btn btn-danger"
                        onclick="removerConfirmado()">
                    Remover
                </button>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const inventarioId =
        document.getElementById('pagina').dataset.inventarioId;

    const modalRemover =
        new bootstrap.Modal(
            document.getElementById('modalRemover')
        );

    let skinSelecionadaId = null;
    let itemIdParaRemover = null;
    let timeoutBusca = null;


    function mostrarAlerta(mensagem, tipo) {

        const alerta = document.getElementById('alerta');

        alerta.className = 'alert alert-' + tipo;

        alerta.innerText = mensagem;

        alerta.classList.remove('d-none');
    }


    document.getElementById('buscaSkin')
        .addEventListener('input', (e) => {

            clearTimeout(timeoutBusca);

            const termo = e.target.value.trim();

            document.getElementById('resultadosBusca').innerHTML = '';

            if (!termo) return;

            timeoutBusca =
                setTimeout(() => buscarSkins(termo), 300);
        });


    async function buscarSkins(termo) {

        try {

            const resp =
                await fetch(
                    `/api/skins/buscar?nome=${encodeURIComponent(termo)}`
                );

            if (!resp.ok) {
                throw new Error('Falha ao buscar skins.');
            }

            const skins = await resp.json();

            const container =
                document.getElementById('resultadosBusca');

            container.innerHTML = '';

            skins.forEach(skin => {

                const item =
                    document.createElement('button');

                item.type = 'button';

                item.className =
                    'list-group-item list-group-item-action';

                item.textContent =
                    skin.nome +
                    ' — R$ ' +
                    (
                        skin.preco != null
                            ? Number(skin.preco).toFixed(2)
                            : '?'
                    );

                item.addEventListener(
                    'click',
                    () => selecionarSkin(skin)
                );

                container.appendChild(item);
            });

        } catch (e) {

            mostrarAlerta(e.message, 'danger');
        }
    }


    function selecionarSkin(skin) {

        skinSelecionadaId = skin.externalId;

        document
            .getElementById('skinSelecionada')
            .classList.remove('d-none');

        document
            .getElementById('nomeSelecionada')
            .innerText = skin.nome;

        document
            .getElementById('btnConfirmarAdicionar')
            .disabled = false;
    }


    async function confirmarAdicionar() {

        const quantidade =
            parseInt(
                document.getElementById('quantidadeAdicionar').value,
                10
            ) || 1;

        try {

            const params =
                new URLSearchParams({
                    skinExternalId: skinSelecionadaId,
                    quantidade: quantidade
                });

            const resp =
                await fetch(
                    `/api/inventarios/${inventarioId}/itens?${params}`,
                    {
                        method: 'POST'
                    }
                );

            if (!resp.ok) {
                throw new Error('Falha ao adicionar skin.');
            }

            location.reload();

        } catch (e) {

            mostrarAlerta(e.message, 'danger');
        }
    }


    document
        .querySelectorAll('.btn-remover-item')
        .forEach(btn => {

            btn.addEventListener('click', () => {

                const col =
                    btn.closest('[data-item-id]');

                itemIdParaRemover =
                    col.dataset.itemId;

                document
                    .getElementById('nomeItemRemover')
                    .innerText =
                    col.querySelector('.card-title').innerText;

                modalRemover.show();
            });
        });


    async function removerConfirmado() {

        if (!itemIdParaRemover) return;

        try {

            const resp =
                await fetch(
                    `/api/inventarios/${inventarioId}/itens/${itemIdParaRemover}`,
                    {
                        method: 'DELETE'
                    }
                );

            if (!resp.ok) {
                throw new Error('Falha ao remover item.');
            }

            location.reload();

        } catch (e) {

            mostrarAlerta(e.message, 'danger');
        }
    }


    async function atualizarQuantidade(itemId, quantidade) {

        if (quantidade < 1) return;

        try {

            const resp =
                await fetch(
                    `/api/inventarios/${inventarioId}/itens/${itemId}?quantidade=${quantidade}`,
                    {
                        method: 'PUT'
                    }
                );

            if (!resp.ok) {
                throw new Error('Falha ao atualizar quantidade.');
            }

            location.reload();

        } catch (e) {

            mostrarAlerta(e.message, 'danger');
        }
    }


    document
        .querySelectorAll('.btn-aumentar')
        .forEach(btn => {

            btn.addEventListener('click', () => {

                const col =
                    btn.closest('[data-item-id]');

                const input =
                    col.querySelector('.quantidade-input');

                atualizarQuantidade(
                    col.dataset.itemId,
                    parseInt(input.value, 10) + 1
                );
            });
        });


    document
        .querySelectorAll('.btn-diminuir')
        .forEach(btn => {

            btn.addEventListener('click', () => {

                const col =
                    btn.closest('[data-item-id]');

                const input =
                    col.querySelector('.quantidade-input');

                const nova =
                    parseInt(input.value, 10) - 1;

                if (nova >= 1) {

                    atualizarQuantidade(
                        col.dataset.itemId,
                        nova
                    );
                }
            });
        });

</script>

</body>
</html>
