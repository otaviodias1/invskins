<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">

    <div class="row mb-4">
        <!-- Formulário para Criar/Editar Inventário -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0" th:text="${inventarioEdicao != null ? 'Editar Inventário' : 'Novo Inventário'}">Novo Inventário</h5>
                </div>
                <div class="card-body">
                    <!-- Ação altera dependendo se é edição ou criação -->
                    <form th:action="${inventarioEdicao != null ? '/inventarios/' + inventarioEdicao.id + '/editar' : '/inventarios'}" method="post">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome"
                                   th:value="${inventarioEdicao != null ? inventarioEdicao.nome : ''}"
                                   maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="3"
                                      maxlength="255" th:text="${inventarioEdicao != null ? inventarioEdicao.descricao : ''}"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" th:text="${inventarioEdicao != null ? 'Atualizar' : 'Salvar'}">Salvar</button>
                        <a th:if="${inventarioEdicao != null}" href="/inventarios" class="btn btn-link w-100 text-secondary mt-1">Cancelar Edição</a>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela de Inventários -->
        <div class="col-md-8">
            <h2>Lista de Inventários</h2>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Itens</th>
                        <th>Valor total</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${inventarios}">
                        <td th:text="${inv.nome}"></td>
                        <td th:text="${inv.descricao}"></td>
                        <td th:text="${inv.itens != null ? inv.itens.size() : 0}"></td>
                        <td>R$ <span th:text="${inv.valorTotal != null ? #numbers.formatDecimal(inv.valorTotal, 1, 2) : '0,00'}"></span></td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a class="btn btn-outline-secondary" th:href="@{/inventarios/{id}(id=${inv.id})}">Ver</a>

                                <!-- Botão de Edição (carrega os dados no formulário ao lado) -->
                                <a class="btn btn-outline-primary" th:href="@{/inventarios(editarId=${inv.id})}">Editar</a>

                                <!-- Formulário para Exclusão Direta (POST com method DELETE) -->
                                <form th:action="@{/inventarios/{id}/deletar(id=${inv.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-danger btn-sm"
                                            style="border-top-left-radius: 0; border-bottom-left-radius: 0;">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${inventarios == null or #lists.isEmpty(inventarios)}" class="text-muted">Nenhum inventário cadastrado.</p>
        </div>
    </div>

</div>

</body>
</html>
