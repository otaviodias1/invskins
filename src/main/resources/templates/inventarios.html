<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Inventários</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalInventario" onclick="abrirCriacao()">
            + Novo inventário
        </button>
    </div>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Itens</th>
                <th>Valor total</th>
                <th>Criado em</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inv : ${inventarios}"
                th:data-id="${inv.id}"
                th:data-nome="${inv.nome}"
                th:data-descricao="${inv.descricao}">
                <td th:text="${inv.nome}"></td>
                <td th:text="${inv.descricao}"></td>
                <td th:text="${inv.itens.size()}"></td>
                <td>R$ <span th:text="${#numbers.formatDecimal(inv.valorTotal, 1, 2)}"></span></td>
                <td th:text="${#temporals.format(inv.dataCriacao, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/inventarios/{id}(id=${inv.id})}">Ver</a>
                    <button class="btn btn-sm btn-outline-primary btn-editar">Editar</button>
                    <button class="btn btn-sm btn-outline-danger btn-excluir">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${inventarios.isEmpty()}" class="text-muted">Nenhum inventário cadastrado.</p>
</div>

<!-- Modal Criar/Editar -->
<div class="modal fade" id="modalInventario" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Novo inventário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formInventario" onsubmit="return false;">
                    <input type="hidden" id="inventarioId">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" maxlength="255"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="salvarInventario()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Confirmação de exclusão -->
<div class="modal fade" id="modalExclusao" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja excluir o inventário <strong id="nomeExclusao"></strong>?</p>
                <p class="text-danger small">Essa ação não pode ser desfeita e todos os itens dele serão removidos.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" onclick="excluirConfirmado()">Excluir</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let idParaExcluir = null;
    const modalInventario = new bootstrap.Modal(document.getElementById('modalInventario'));
    const modalExclusao = new bootstrap.Modal(document.getElementById('modalExclusao'));

    function mostrarAlerta(mensagem, tipo) {
        const alerta = document.getElementById('alerta');
        alerta.className = 'alert alert-' + tipo;
        alerta.innerText = mensagem;
        alerta.classList.remove('d-none');
    }

    function abrirCriacao() {
        document.getElementById('tituloModal').innerText = 'Novo inventário';
        document.getElementById('inventarioId').value = '';
        document.getElementById('nome').value = '';
        document.getElementById('descricao').value = '';
    }

    function abrirEdicao(id, nome, descricao) {
        document.getElementById('tituloModal').innerText = 'Editar inventário';
        document.getElementById('inventarioId').value = id;
        document.getElementById('nome').value = nome;
        document.getElementById('descricao').value = descricao;
        modalInventario.show();
    }

    async function salvarInventario() {
        const id = document.getElementById('inventarioId').value;
        const nome = document.getElementById('nome').value.trim();
        const descricao = document.getElementById('descricao').value.trim();

        if (!nome) {
            mostrarAlerta('O nome é obrigatório.', 'danger');
            return;
        }

        const url = id ? `/api/inventarios/${id}` : '/api/inventarios';
        const metodo = id ? 'PUT' : 'POST';

        try {
            const resp = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, descricao })
            });
            if (!resp.ok) throw new Error('Falha ao salvar inventário.');
            location.reload();
        } catch (e) {
            mostrarAlerta(e.message, 'danger');
        }
    }

    function confirmarExclusao(id, nome) {
        idParaExcluir = id;
        document.getElementById('nomeExclusao').innerText = nome;
        modalExclusao.show();
    }

    async function excluirConfirmado() {
        if (!idParaExcluir) return;
        try {
            const resp = await fetch(`/api/inventarios/${idParaExcluir}`, { method: 'DELETE' });
            if (!resp.ok) throw new Error('Falha ao excluir inventário.');
            location.reload();
        } catch (e) {
            mostrarAlerta(e.message, 'danger');
        }
    }

    document.querySelectorAll('.btn-editar').forEach(btn => {
        btn.addEventListener('click', () => {
            const tr = btn.closest('tr');
            abrirEdicao(tr.dataset.id, tr.dataset.nome, tr.dataset.descricao);
        });
    });

    document.querySelectorAll('.btn-excluir').forEach(btn => {
        btn.addEventListener('click', () => {
            const tr = btn.closest('tr');
            confirmarExclusao(tr.dataset.id, tr.dataset.nome);
        });
    });
</script>
</body>
</html>
